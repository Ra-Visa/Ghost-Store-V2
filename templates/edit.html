{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        {% if product %}
                            Edit Product: {{ product.name }}
                        {% else %}
                            Add New Product
                        {% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Product Name</label>
                            <input type="text" class="form-control bg-dark text-light" id="name" name="name" 
                                   value="{{ product.name if product else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="price" class="form-label">Price ($)</label>
                            <input type="number" step="0.01" class="form-control bg-dark text-light" id="price" name="price" 
                                   value="{{ product.price if product else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="image_url" class="form-label">Image URL</label>
                            <input type="url" class="form-control bg-dark text-light" id="image_url" name="image_url" 
                                   value="{{ product.image_url if product else '' }}" required>
                            <small class="text-muted">Enter a valid image URL (e.g., https://example.com/image.jpg)</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control bg-dark text-light" id="description" name="description" 
                                      rows="4" required>{{ product.description if product else '' }}</textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-ghost">
                                {% if product %}
                                    <i class="bi bi-check-circle"></i> Update Product
                                {% else %}
                                    <i class="bi bi-plus-circle"></i> Add Product
                                {% endif %}
                            </button>
                            <a href="/admin" class="btn btn-outline-ghost">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
