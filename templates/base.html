<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Store</title>
    <!-- Bootstrap 5 Dark Theme CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0a0c0f;
            color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #000000 !important;
            border-bottom: 3px solid #00ff00;
            box-shadow: 0 2px 10px rgba(0, 255, 0, 0.2);
        }
        .navbar-brand img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 0 5px #00ff00);
        }
        .navbar-brand:hover img {
            filter: drop-shadow(0 0 10px #00ff00);
            transition: 0.3s;
        }
        .card {
            background-color: #1a1d20;
            border: 2px solid #00ff00;
            border-radius: 15px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.1);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 255, 0, 0.3);
            border-color: #00ff00;
        }
        .btn-ghost {
            background: linear-gradient(45deg, #00ff00, #00cc00);
            color: black;
            border: none;
            font-weight: bold;
        }
        .btn-ghost:hover {
            background: linear-gradient(45deg, #00cc00, #009900);
            color: white;
            transform: scale(1.05);
            transition: 0.3s;
        }
        .btn-outline-ghost {
            border: 2px solid #00ff00;
            color: #00ff00;
            background: transparent;
        }
        .btn-outline-ghost:hover {
            background-color: #00ff00;
            color: black;
        }
        .modal-content {
            background-color: #1a1d20;
            color: #e9ecef;
            border: 2px solid #00ff00;
            border-radius: 15px;
        }
        .list-group-item {
            background-color: #1a1d20;
            color: #e9ecef;
            border-color: #00ff00;
        }
        .alert {
            background-color: #1a1d20;
            color: #e9ecef;
            border: 1px solid #00ff00;
            border-radius: 10px;
        }
        footer {
            background-color: #000000;
            border-top: 2px solid #00ff00;
            color: #00ff00;
        }
        .table-dark {
            background-color: #1a1d20;
        }
        .table-dark th {
            border-bottom: 2px solid #00ff00;
            color: #00ff00;
        }
        .table-dark td {
            border-color: #333;
        }
        .form-control, .form-select {
            background-color: #1a1d20;
            border: 1px solid #00ff00;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1a1d20;
            border-color: #00ff00;
            box-shadow: 0 0 0 0.25rem rgba(0, 255, 0, 0.25);
            color: white;
        }
        .form-label {
            color: #00ff00;
            font-weight: bold;
        }
        .text-success {
            color: #00ff00 !important;
        }
        .bg-success {
            background-color: #00ff00 !important;
        }
        .btn-success {
            background-color: #00ff00;
            border-color: #00ff00;
            color: black;
            font-weight: bold;
        }
        .btn-success:hover {
            background-color: #00cc00;
            border-color: #00cc00;
            color: black;
        }
        h1, h2, h3, h4, h5 {
            color: #00ff00;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
        }
        .badge {
            background-color: #00ff00;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="https://i.ibb.co/CsXf3S0C/Chat-GPT-Image-Mar-11-2026-03-42-51-PM.png" alt="Ghost Store Logo">
                <span style="color: #00ff00; font-weight: bold; margin-left: 10px;">Ghost Store</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/" style="color: #00ff00;">Home</a>
                    </li>
                    {% if session.get('admin_logged_in') %}
                    <li class="nav-item">
                        <a class="nav-link" href="/admin" style="color: #00ff00;">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/logout" style="color: #00ff00;">Logout</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Ghost Store. All rights reserved.</p>
            <p class="mb-0"><small>Powered by Green Ghost</small></p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
