<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Store</title>
    <!-- Bootstrap 5 Dark Theme CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #1a1d20;
            color: #e9ecef;
        }
        .navbar {
            background-color: #212529 !important;
            border-bottom: 2px solid #6f42c1;
        }
        .navbar-brand img {
            height: 40px;
            width: auto;
        }
        .card {
            background-color: #2c3034;
            border: 1px solid #6f42c1;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(111, 66, 193, 0.3);
        }
        .btn-ghost {
            background-color: #6f42c1;
            color: white;
            border: none;
        }
        .btn-ghost:hover {
            background-color: #5a32a3;
            color: white;
        }
        .btn-outline-ghost {
            border-color: #6f42c1;
            color: #6f42c1;
        }
        .btn-outline-ghost:hover {
            background-color: #6f42c1;
            color: white;
        }
        .modal-content {
            background-color: #2c3034;
            color: #e9ecef;
        }
        .list-group-item {
            background-color: #2c3034;
            color: #e9ecef;
            border-color: #6f42c1;
        }
        .alert {
            background-color: #2c3034;
            color: #e9ecef;
            border-color: #6f42c1;
        }
        footer {
            background-color: #212529;
            border-top: 1px solid #6f42c1;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="https://i.ibb.co/CsXf3S0C/Chat-GPT-Image-Mar-11-2026-03-42-51-PM.png" alt="Ghost Store Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    {% if session.get('admin_logged_in') %}
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/logout">Logout</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Ghost Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
